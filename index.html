:root{
  --ink:#171310;
  --gold:#c2a15a;
  --gold-2:#8f7432;
  --cream:#faf7ef;
  --surface:#fffdf7;
  --line:#e7dcc3;
  --muted:#6e6555;
  --success:#1f6b4a;
  --danger:#9c3b2d;
}

@media (prefers-color-scheme: dark){
  :root{
    --ink:#f4eee0;
    --gold:#d5b86f;
    --gold-2:#e2c87f;
    --cream:#171310;
    --surface:#221d18;
    --line:#3d362b;
    --muted:#c3b9a5;
    --success:#6fd09e;
    --danger:#ff8f7d;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

html,body{
  height:auto;
  overflow-y:auto;
  overflow-x:clip
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button{
  min-height:44px
}

button:active{
  transform:translateY(1px)
}

@keyframes toast-in{
  from{
    opacity:0;
    transform:translate(-50%,12px)
  }

  to{
    opacity:1;
    transform:translate(-50%,0)
  }
}

.toast-in{
  animation:toast-in .18s ease-out
}

@keyframes save-pulse{
  0%{
    box-shadow:0 0 0 0 rgba(16,185,129,.45)
  }

  100%{
    box-shadow:0 0 0 10px rgba(16,185,129,0)
  }
}

.save-pulse{
  animation:save-pulse .7s ease-out
}

.serif{
  font-family:Georgia,"Times New Roman",serif
}

button,a,input,select,textarea{
  font:inherit
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--gold)!important;
  box-shadow:0 0 0 3px rgba(194,161,90,.18)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.gold-line{
  height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)
}

.field{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  background:var(--surface);
  color:var(--ink)
}

.label{
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:7px;
  display:block
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer
}

.chip.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}

.zbrd-badge{
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  transition:transform .15s ease, box-shadow .15s ease
}

.zbrd-badge:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 16px rgba(194,161,90,.28)
}

.zbrd-badge:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px
}

@media (max-width:420px){
  .zbrd-badge{
    padding-right:8px
  }

  .zbrd-badge>span:last-child{
    max-width:76px
  }
}
